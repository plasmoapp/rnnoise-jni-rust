name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rust:
    name: Build Binaries
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x86
            os: ubuntu-22.04
            target: i686-unknown-linux-gnu

          - build: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - build: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu

          - build: win-x86
            os: windows-latest
            target: i686-pc-windows-msvc

          - build: win-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - build: mac-x86_64
            os: macos-15
            target: x86_64-apple-darwin

          - build: mac-aarch64
            os: macos-15
            target: aarch64-apple-darwin


    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install gcc-aarch64-linux-gnu
        if: matrix.build == 'linux-aarch64'
        run: sudo apt-get update && sudo apt-get install gcc-aarch64-linux-gnu -y

      - name: Install gcc-i686-linux-gnu
        if: matrix.build == 'linux-x86'
        run: sudo apt-get update && sudo apt-get install gcc-i686-linux-gnu libc6-dev-i386 -y

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml

      - name: Create platform dir
        shell: bash
        run: |
          binary_name="rnnoise_jni_rust"

          dirname="src/main/resources/natives/${{ matrix.build }}"
          mkdir "$dirname"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "rust/target/${{ matrix.target }}/release/$binary_name.dll" "$dirname"
          elif [ "${{ matrix.os }}" = "macos-14" ]; then
            mv "rust/target/${{ matrix.target }}/release/lib$binary_name.dylib" "$dirname"
          else
            mv "rust/target/${{ matrix.target }}/release/lib$binary_name.so" "$dirname"
          fi

          ls -l "$dirname"
          echo "ASSET=$dirname" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build }}
          path: ${{ env.ASSET }}

  build:
    name: Build Jar
    runs-on: ubuntu-latest
    needs: build-rust

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: src/main/resources/natives

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar
