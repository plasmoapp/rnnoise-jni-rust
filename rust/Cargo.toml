[package]
name = "rnnoise-jni-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
eyre = "0.6.12"
jni = "0.22.4"
nnnoiseless = "0.5.2"

[lib]
crate-type = ["cdylib"]

# https://github.com/johnthagen/min-sized-rust
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
